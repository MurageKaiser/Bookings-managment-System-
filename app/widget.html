<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>Bookings Operations</title>

    <!-- Zoho Creator Widget SDK -->
    <script
        src="https://js.zohostatic.com/creator/widgets/version/1.0/widgetsdk-min.js">
    </script>

    <!-- Widget CSS -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

<div class="widget-container">

    <!-- =====================================================
         HEADER
    ===================================================== -->

    <div class="page-header">

        <h1 class="page-title">
            Bookings Operations
        </h1>

        <div class="page-subtitle">
            Manage ongoing jobs and booking confirmations
        </div>

    </div>


    <!-- =====================================================
         TABS
    ===================================================== -->
<div class="tabs">
    <button class="tab-button active" data-tab="ongoingJobsTab">Ongoing Jobs</button>
    <button class="tab-button" data-tab="confirmBookingsTab">New Bookings</button>
    <button class="tab-button" data-tab="planApproveTab">Not Started Jobs</button>
    <button class="tab-button" data-tab="dispatchedJobsTab">Dispatched Jobs</button>
</div>


    <!-- =====================================================
         TAB 1 — CURRENT ONGOING JOBS
    ===================================================== -->

    <div
        id="ongoingJobsTab"
        class="tab-content active">

        <div class="section-header">

            <h2 class="section-title">
                Current Ongoing Jobs
            </h2>

            <span
                id="ongoingCount"
                class="record-count">
                Loading...
            </span>

        </div>

        <div id="ongoingJobsContainer">

            <div class="loading">
                Loading ongoing jobs...
            </div>

        </div>

    </div>


    <!-- =====================================================
         TAB 2 — BOOKINGS TO CONFIRM
    ===================================================== -->

    <div
        id="confirmBookingsTab"
        class="tab-content">

        <div class="section-header">

            <h2 class="section-title">
                New Bookings
            </h2>

            <span
                id="confirmCount"
                class="record-count">
                Loading...
            </span>

        </div>

        <div id="confirmBookingsContainer">

            <div class="loading">
                Loading bookings...
            </div>

        </div>

    </div>


    <!-- =====================================================
         TAB 3 — NOT STARTED JOBS
    ===================================================== -->

    <div id="planApproveTab" class="tab-content">
    <div class="section-header">
        <h2 class="section-title">Not Started Jobs</h2>
        <span id="notStartedCount" class="record-count">Loading...</span>
    </div>
    <div id="notStartedJobsContainer">
        <div class="loading">Loading jobs...</div>
    </div>
</div>

<div id="dispatchedJobsTab" class="tab-content">
    <div class="section-header">
        <h2 class="section-title">Dispatched Jobs</h2>
        <span id="dispatchedCount" class="record-count">Loading...</span>
    </div>
    <div id="dispatchedJobsContainer">
        <div class="loading">Loading dispatched jobs...</div>
    </div>
</div>

<!-- =========================================================
     JAVASCRIPT FILES
========================================================= -->

<script src="config.js"></script>
<script src="blueprint-config.js"></script>
<script src="api.js"></script>
<script src="enforcements.js"></script>
<script src="app.js"></script>
</body>
</html>
